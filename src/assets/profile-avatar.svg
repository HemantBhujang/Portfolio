<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="10 5" opacity="0.6"/>
  <!-- Head & Torso Silhouette -->
  <circle cx="200" cy="150" r="65" fill="url(#avatarGrad)"/>
  <path d="M 90 340 C 90 250, 140 230, 200 230 C 260 230, 310 250, 310 340 Z" fill="url(#avatarGrad)"/>
  <!-- Tech Glasses / Glow Accent -->
  <rect x="155" y="140" width="35" height="18" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="210" y="140" width="35" height="18" rx="4" fill="#38bdf8" opacity="0.9"/>
  <line x1="190" y1="149" x2="210" y2="149" stroke="#38bdf8" stroke-width="3"/>
  <!-- Code Symbol Accent -->
  <text x="200" y="320" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="22" font-weight="bold">&lt;HB /&gt;</text>
</svg>
